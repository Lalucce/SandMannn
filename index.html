<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Deus Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English&display=swap">
<meta name="theme-color" content="#0b0f16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deus Sandbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  color-scheme:light;
  --void:#0b0f16;
  --panel:rgba(247,240,224,.94);
  --panel2:rgba(236,226,200,.97);
  --edge:rgba(118,86,36,.42);
  --edge2:rgba(118,86,36,.17);
  --ink:#2b2013;
  --ink2:#6e5b38;
  --accent:#b9791c;
  --accent2:#e2a93b;
  --onAccent:#fff6e2;
  --good:#4c8c3c;
  --bad:#b4402c;
  --shadow:0 5px 16px rgba(40,24,6,.34);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --panel:rgba(22,19,16,.93);
    --panel2:rgba(36,31,25,.96);
    --edge:rgba(214,176,100,.42);
    --edge2:rgba(214,176,100,.16);
    --ink:#f2e9d3;
    --ink2:#a99b7d;
    --accent:#e2b25c;
    --accent2:#f2cf88;
    --onAccent:#2a1a05;
    --good:#7cbc70;
    --bad:#d9634e;
    --shadow:0 5px 16px rgba(0,0,0,.52);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--void);overscroll-behavior:none;font:600 12px/1.25 var(--ui);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;touch-action:manipulation;padding:0}
.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.i .f{fill:currentColor;stroke:none}
.plate{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--edge);border-radius:10px;box-shadow:var(--shadow),inset 0 0 0 1px var(--edge2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* barra de estado */
#stats{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;gap:15px;padding:8px 13px;pointer-events:none;font-variant-numeric:tabular-nums}
#stats .st{display:flex;align-items:center;gap:6px}
#stats .st .i{color:var(--accent);width:15px;height:15px}
#stats b{font-weight:700;font-size:12.5px}
#sY b{font-family:var(--serif)}
#speed{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;padding:4px;align-items:center}
.seg{display:flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden}
.seg button{min-width:38px;height:32px;padding:0 9px;font-weight:700;font-size:12px;display:grid;place-items:center;border-right:1px solid var(--edge2);color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--onAccent)}
#pbtn{width:38px;height:32px;border:1px solid var(--edge);border-radius:7px;display:grid;place-items:center;color:var(--accent)}
#mini{inset:auto;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:7px;cursor:pointer;touch-action:none;padding:0}

/* trilho de categorias e dock de ferramentas */
#rail{left:max(8px,env(safe-area-inset-left));top:62px;max-height:calc(100% - 146px);display:flex;flex-direction:column;gap:4px;padding:5px;overflow-y:auto;scrollbar-width:none;touch-action:pan-y}
#rail::-webkit-scrollbar,#bar::-webkit-scrollbar{display:none}
.tab{flex:none;width:42px;height:42px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.tab .i{width:23px;height:23px}
.tab.on{background:var(--accent);color:var(--onAccent)}
#bar{left:calc(max(8px,env(safe-area-inset-left)) + 64px);right:calc(max(8px,env(safe-area-inset-right)) + 68px);bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:stretch;gap:3px;padding:5px 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x}
#bar .cap{flex:none;position:sticky;left:0;z-index:2;writing-mode:vertical-rl;transform:rotate(180deg);font:700 10px var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);padding:0 7px 0 3px;margin-right:2px;border-right:1px solid var(--edge2);background:var(--panel);display:grid;place-items:center}
.tl{flex:none;width:58px;height:56px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);font-size:10px;font-weight:700}
.tl .i{width:25px;height:25px}
.tl span{white-space:nowrap}
.tl.on{background:var(--panel2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent),inset 0 0 0 1px var(--edge)}

/* zoom e pincel */
#zoom{right:max(8px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 76px);display:flex;flex-direction:column;padding:3px}
#zoom button{width:42px;height:38px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)}
#zoom button+button{border-top:1px solid var(--edge2)}
#zoom .i{width:20px;height:20px}
#brush{right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:54px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
#brush .bd{width:32px;height:32px;display:grid;place-items:center}
#brush .bd i{display:block;border:2px solid var(--accent);border-radius:50%;background:var(--edge2)}
#brush .bl{font:700 9.5px var(--serif);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}

/* cartão de seleção e avisos */
#info{top:94px;left:50%;transform:translateX(-50%);min-width:232px;max-width:min(360px,50vw);display:none;padding:9px 12px 10px;text-align:left}
#info .nm{font:700 15px var(--serif);display:flex;align-items:center;gap:7px}
#info .nm .i{color:var(--accent)}
#info .sub{color:var(--ink2);font-size:11.5px;margin-top:2px;font-weight:600}
#info .hp{height:6px;border-radius:3px;background:var(--edge2);margin:7px 0 2px;overflow:hidden}
#info .hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--good))}
.act{display:flex;gap:6px;margin-top:8px}
.act button{flex:1;height:36px;border-radius:8px;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:12px}
.act button.on{background:var(--accent);color:var(--onAccent);border-color:transparent}
#toast{left:50%;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 80px);transform:translateX(-50%) translateY(6px);padding:8px 15px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast .i{color:var(--accent)}

/* gaveta de pessoas e reinos */
.drawer{top:max(8px,env(safe-area-inset-top));bottom:max(8px,env(safe-area-inset-bottom));right:max(8px,env(safe-area-inset-right));width:min(350px,50vw);display:none;flex-direction:column;z-index:8;overflow:hidden}
.drawer.show{display:flex}
.ph{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px 0 8px;border-bottom:1px solid var(--edge2)}
.tabs{display:flex;gap:2px}
.tabs button{height:40px;padding:0 12px;font:700 13px var(--serif);display:flex;align-items:center;gap:6px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .i{width:16px;height:16px}
.xb{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;color:var(--ink2);flex:none}
#pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 10px 28px;touch-action:pan-y}
.chips{display:flex;gap:6px;overflow-x:auto;padding:3px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;font-size:11.5px;font-weight:700;border:1px solid var(--edge);border-radius:15px;color:var(--ink2)}
.chip.on{background:var(--accent);color:var(--onAccent);border-color:transparent}
.cnt{color:var(--ink2);font-size:11px;margin:8px 2px 2px;letter-spacing:.03em}
.row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px solid var(--edge2);cursor:pointer;min-height:54px;border-radius:8px}
.row:active{background:var(--edge2)}
.pt{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 0;image-rendering:pixelated;background:var(--panel2);border:1px solid var(--edge);flex:none}
.pt.big{width:62px;height:62px}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .tx b{font:700 13.5px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.row .tx b .i{color:var(--accent);width:14px;height:14px}
.row small{color:var(--ink2);font-weight:600;font-size:11px;line-height:1.4}
.ag{font:700 12px var(--serif);color:var(--ink2);flex:none}
.crest{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.crest .i{width:22px;height:22px}
.back{height:34px;padding:0 11px 0 6px;margin-bottom:8px;font-weight:700;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--edge);border-radius:8px;color:var(--ink2)}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.nm2{font:700 19px/1.15 var(--serif)}
.hd small{color:var(--ink2);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.tag{padding:3px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--edge);font-size:11px;font-weight:700}
h4{margin:16px 0 4px;font:700 11px var(--serif);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);display:flex;align-items:center;gap:8px}
h4::after{content:"";flex:1;height:1px;background:var(--edge2)}
.sr{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:12px;font-weight:700}
.sr b{text-align:right}
.tk{height:7px;border-radius:4px;background:var(--edge2);overflow:hidden}
.tk i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--edge2);font-size:12px}
.kv span{color:var(--ink2);font-weight:600}
.kv b{text-align:right}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;height:42px;font-weight:700;border:1px solid var(--edge);border-radius:9px;display:flex;align-items:center;justify-content:center;gap:7px}
.btns button.on{background:var(--accent);color:var(--onAccent);border-color:transparent}
.empty{color:var(--ink2);font-size:12px;text-align:center;margin-top:26px;line-height:1.45}

/* janelas */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.62)}
.modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:18px 20px;max-width:min(540px,90vw);max-height:88vh;overflow:auto;box-shadow:var(--shadow),inset 0 0 0 1px var(--edge2);color:var(--ink)}
.card h2{margin:0 0 8px;font:700 21px var(--serif);display:flex;align-items:center;gap:10px}
.card h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
.card p{margin:9px 0;font-size:13px;line-height:1.5;font-weight:500;display:flex;gap:11px;align-items:flex-start}
.card p .i{color:var(--accent);width:19px;height:19px;margin-top:1px}
.card .go{margin-top:12px;width:100%;height:44px;background:var(--accent);color:var(--onAccent);font:700 14px var(--serif);letter-spacing:.08em;text-transform:uppercase;border-radius:9px}
#rotm{z-index:30;background:var(--void)}
.rotic{width:68px;height:68px;margin:0 auto 6px;color:var(--accent);animation:tw 2.2s ease-in-out infinite}
.rotic .i{width:68px;height:68px;stroke-width:1.2}
@keyframes tw{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.rotic{animation:none}}
#rotm{display:none!important}
/* ===== pele sombria: ferro escuro, latão envelhecido, brasa ===== */
:root{color-scheme:dark;--void:#06070a;--panel:rgba(16,14,12,.94);--panel2:rgba(36,30,24,.97);--edge:rgba(184,148,84,.55);--edge2:rgba(184,148,84,.2);--ink:#e9dfc6;--ink2:#a49b86;--accent:#c8963c;--accent2:#ecc26f;--onAccent:#1b1209;--good:#74a05c;--bad:#c04a3c;--shadow:0 10px 26px rgba(0,0,0,.7);--serif:"Cinzel","Trajan Pro","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--fell:"IM Fell English","Palatino Linotype",Palatino,Georgia,serif}
.plate,.card{background:linear-gradient(var(--accent2),var(--accent2)) 5px 5px/10px 1px no-repeat,linear-gradient(var(--accent2),var(--accent2)) 5px 5px/1px 10px no-repeat,linear-gradient(var(--accent2),var(--accent2)) right 5px top 5px/10px 1px no-repeat,linear-gradient(var(--accent2),var(--accent2)) right 5px top 5px/1px 10px no-repeat,linear-gradient(var(--accent2),var(--accent2)) left 5px bottom 5px/10px 1px no-repeat,linear-gradient(var(--accent2),var(--accent2)) left 5px bottom 5px/1px 10px no-repeat,linear-gradient(var(--accent2),var(--accent2)) right 5px bottom 5px/10px 1px no-repeat,linear-gradient(var(--accent2),var(--accent2)) right 5px bottom 5px/1px 10px no-repeat,radial-gradient(130% 90% at 50% 0,rgba(126,86,40,.2),transparent 62%),linear-gradient(180deg,rgba(30,26,22,.96),rgba(11,10,9,.97));border:1px solid rgba(184,148,84,.5);border-radius:4px;box-shadow:var(--shadow),inset 0 0 0 3px rgba(7,6,5,.92),inset 0 0 0 4px rgba(184,148,84,.2);text-shadow:0 1px 1px rgba(0,0,0,.7)}
.tab,.tl,#zoom button,.card .go,.sb,.svr button,#wd button{border-radius:3px}
.tab.on{background:linear-gradient(180deg,#6d231c,#3b0f0b);color:#f3d89a;box-shadow:inset 0 0 0 1px rgba(236,194,111,.65),0 0 14px rgba(180,56,38,.42)}
.tl.on{background:linear-gradient(180deg,rgba(125,38,32,.55),rgba(40,14,10,.5));color:var(--accent2);box-shadow:inset 0 -2px 0 var(--accent),inset 0 0 0 1px var(--edge)}
.card .go,.sb.pr,.svr button.pr,#wd button.on{background:linear-gradient(180deg,#8a2e24,#4a150f);color:#f6dfa6;border:1px solid rgba(236,194,111,.7);text-shadow:0 1px 0 #000}
.card h2,#info .nm{color:var(--accent2);letter-spacing:.05em}
.card p,#info .sub{font-family:var(--fell);font-size:14.5px;font-weight:400;line-height:1.45}
#info .sub{font-size:13px}
#stats b{font-family:var(--serif);color:var(--accent2)}
#mini{box-shadow:0 0 0 2px #1a130b,0 0 0 3px var(--edge),0 0 0 5px #0b0806,0 8px 20px #000}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:multiply;background:radial-gradient(ellipse at 50% 46%,#c9d1e2 32%,#8f98ae 68%,#3c4358 100%)}
#mist{position:fixed;inset:-10% -20%;z-index:1;pointer-events:none;background:radial-gradient(38% 26% at 22% 32%,rgba(196,210,230,.1),transparent 70%),radial-gradient(34% 24% at 74% 66%,rgba(196,210,230,.08),transparent 70%),radial-gradient(30% 22% at 52% 14%,rgba(196,210,230,.07),transparent 70%);animation:mist 70s ease-in-out infinite alternate;will-change:transform}
@keyframes mist{to{transform:translate3d(8%,3%,0)}}
@media (prefers-reduced-motion:reduce){#mist{animation:none}}
body.fp #vig,body.fp #mist{display:none}
.svr{display:flex;align-items:center;gap:7px;padding:9px 0;border-top:1px solid var(--edge2);flex-wrap:wrap}
.svr .tx{flex:1;min-width:150px;font-size:12.5px;line-height:1.35}
.svr .tx b{display:block;font:700 14px var(--serif)}
.svr .tx small{color:var(--ink2);font-weight:600}
.svr button,.sb{height:38px;padding:0 13px;border-radius:8px;border:1px solid var(--edge);font:700 12.5px var(--serif);color:var(--ink);background:var(--panel2)}
.svr button.pr,.sb.pr{background:var(--accent);color:var(--onAccent);border-color:transparent}
.svr button:disabled{opacity:.4}
.sbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sbs .sb{flex:1;min-width:140px}
#wd{z-index:6;left:calc(max(8px,env(safe-area-inset-left)) + 64px);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 76px);display:none;gap:3px;padding:4px}
#wd.show{display:flex}
#wd button{height:36px;min-width:68px;padding:0 11px;border-radius:7px;font:700 12.5px var(--serif);color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:7px}
#wd button.on{background:var(--accent);color:var(--onAccent)}
#wd button i{display:block;width:9px;border-radius:2px 2px 5px 5px;background:currentColor;opacity:.8}
body.fp #wd{display:none!important}
@media (orientation:portrait){
 #stats{right:max(8px,env(safe-area-inset-right));justify-content:space-between;gap:6px;padding:6px 9px}
 #stats .st{gap:4px}
 #stats b{font-size:11.5px}
 #mini{left:max(8px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 42px);transform:none}
 #speed{top:calc(max(8px,env(safe-area-inset-top)) + 42px)}
 #info{top:calc(max(8px,env(safe-area-inset-top)) + 126px);width:min(340px,92vw);min-width:0;max-width:92vw}
 #rail{top:auto;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 82px);max-height:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
 #bar{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right))}
 #zoom{flex-direction:row;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 142px)}
 #zoom button+button{border-top:0;border-left:1px solid var(--edge2)}
 #brush{right:auto;left:max(8px,env(safe-area-inset-left));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 142px);width:auto;height:46px;flex-direction:row;padding:0 13px}
 #wd{left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 196px)}
 #toast{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 246px)}
 .drawer{top:auto;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));width:auto;height:58vh}
 #rpgb{width:96vw;height:min(92vh,680px)}
 .at{grid-template-columns:96px 1fr 30px}
}
@media (max-height:400px){
  #stats{padding:6px 11px}
  #rail{top:54px;max-height:calc(100% - 136px)}
  .tab{width:36px;height:36px}
  #rail{gap:3px;padding:4px}
  #bar .cap{padding:0 5px 0 2px}
  .tl{width:54px;height:50px}
  .tl .i{width:22px;height:22px}
  #brush{height:58px}
  #zoom{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 70px)}
  #zoom button{height:34px}
  #info{top:84px}
  #mini{width:68px;height:68px}
}

/* modo 3D */
#fpwrap{position:fixed;inset:0;z-index:10;display:none;background:#000;touch-action:none}
body.fp #fpwrap{display:block}
body.fp #cv,body.fp #stats,body.fp #speed,body.fp #mini,body.fp #info,body.fp #rail,body.fp #bar,body.fp #zoom,body.fp #brush,body.fp #pan{display:none!important}
body.fp #toast{z-index:16;bottom:auto;top:96px}
#fp{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#jz{position:absolute;left:0;top:18%;bottom:0;width:40%;touch-action:none}
#lz{position:absolute;right:0;top:0;bottom:0;width:60%;touch-action:none}

<script>
'use strict';
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const W=400,H=400,N=W*H,YEAR=8,MAXE=1500,MAXC=90;
const DEEP=0,SEA=1,SAND=2,GRASS=3,DIRT=4,HILL=5,MTN=6,SNOW=7,LAVA=8,ASH=9,PATH=10;
const T=new Uint8Array(N),F=new Uint8Array(N),FL=new Uint8Array(N),VAR=new Int8Array(N),NZ=new Uint8Array(N);
const OWN=new Int16Array(N),OD=new Float32Array(N),KRGB=[];
const PAL=[[9,26,56],[52,118,134],[158,142,108],[60,88,50],[102,78,56],[80,98,64],[92,94,106],[212,222,232],[226,84,26],[48,44,46],[136,116,84]],PALM=[24,66,104],WL=new Uint8Array(W*H);
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(a+R()*(b-a+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(R()*a.length)];
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
let seed=1,worldT=0,speed=1,dayOn=false,soundOn=true,shake=0,flash=0;
let cw=0,ch=0,dpr=1,base=3,S=3,camx=W/2,camy=H/2,camz=1,vx0=0,vy0=0;
let ents=[],cities=[],kings=[],blds=[],fires=[],parts=[],fx=[],projs=[],torns=[],volcs=[],sel=null,selC=null;
let eid=0,cid=0,kid=0,bid=0;
const bmap=new Map();

/* ---------- ruído e geração do mundo ---------- */
function h2(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),a=h2(xi,yi,s),b=h2(xi+1,yi,s),c=h2(xi,yi+1,s),d=h2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o){let a=1,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*vn(x*f,y*f,s+i*131);n+=a;a*=.5;f*=2}return t/n}

function genWorld(empty){
 seed=(R()*1e9)|0;T.fill(DEEP);WL.fill(0);F.fill(0);FL.fill(0);OWN.fill(0);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;NZ[i]=fbm(x/9,y/9,seed+77,3)*255;VAR[i]=Math.floor(h2(x,y,seed)*9)-4}
 if(empty)return;
 const e=new Float32Array(N),m=new Float32Array(N);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const nx=(x/W-.5)*2,ny=(y/H-.5)*2,i=y*W+x;e[i]=fbm(x/36,y/36,seed,5)-Math.pow(Math.max(Math.abs(nx),Math.abs(ny)),3)*.42;m[i]=fbm(x/28,y/28,seed+500,2)}
 const s=Float32Array.from(e).sort(),q=p=>s[Math.floor(p*(N-1))];
 const q1=q(.3),q2=q(.45),q3=q(.49),qh=q(.86),qm=q(.93);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x,v=e[i],ny=Math.abs(y/H-.5)*2;let t;
  if(v<q1)t=DEEP;else if(v<q2)t=SEA;else if(v<q3)t=SAND;
  else if(v<qh)t=m[i]<.36?SAND:m[i]<.45?DIRT:GRASS;
  else if(v<qm)t=HILL;else t=MTN;
  if(t>SEA&&t!==MTN&&ny*1.15+(fbm(x/20,y/20,seed+900,2)-.5)*.6>.9)t=SNOW;
  T[i]=t;const fo=fbm(x/9,y/9,seed+300,2);
  if(t===GRASS){if(fo>.5?R()<.7:R()<.012)F[i]=1}
  else if(t===DIRT){if(R()<.03)F[i]=1}
  else if(t===HILL){if(fo>.48&&R()<.45)F[i]=2}
  else if(t===SNOW){if(fo>.46&&R()<.5)F[i]=2}
 }
}
function resetWorld(empty){
 ents=[];cities=[];kings=[];blds=[];fires=[];parts=[];fx=[];projs=[];torns=[];volcs=[];sel=null;selC=null;news.length=0;bmap.clear();KRGB.length=0;worldT=0;
 genWorld(empty);Q=[];quest=null;corpses.length=0;nodes=[];lootL=[];pois=[];fnums=[];known.clear();expl=new Uint8Array(EN*EN);
 if(!empty){for(const[k,n]of[['sheep',64],['cow',36],['chicken',42],['deer',44],['wolf',10],['bear',5]])for(let i=0;i<n;i++)spawnRand(k);genPOIs()}
 hideInfo();updBuf(0,false);
}
function spawnRand(k){for(let n=0;n<120;n++){const x=rnd(2,W-2),y=rnd(2,H-2),t=T[(y|0)*W+(x|0)];if(t===GRASS||t===DIRT||t===HILL){mk(k,x,y);return}}}

/* ---------- buffer do terreno (1 pixel por tile) ---------- */
const tc=document.createElement('canvas');tc.width=W;tc.height=H;
const tcx=tc.getContext('2d'),img=tcx.createImageData(W,H),D=img.data;
function tAt(x,y){return x<0||y<0||x>=W||y>=H?DEEP:T[y*W+x]}
function updBuf(tm,low,rx0,ry0,rx1,ry1){
 if(rx0===undefined){rx0=0;ry0=0;rx1=W;ry1=H}
 for(let y=ry0;y<ry1;y++)for(let x=rx0,i=y*W+rx0;x<rx1;x++,i++){
  const t=T[i],p=t===SEA&&WL[i]?PALM:PAL[t],v=VAR[i]+(NZ[i]-128)*.07;let r=p[0]+v,g=p[1]+v,b=p[2]+v;
  if(t<=SEA){
   const w=Math.sin(x*.6+y*.4+tm*1.7)*Math.sin(y*.55-x*.25+tm*1.2);r+=w*6;g+=w*7;b+=w*8;
   if(t===SEA&&!WL[i]&&(tAt(x-1,y)>SEA||tAt(x+1,y)>SEA||tAt(x,y-1)>SEA||tAt(x,y+1)>SEA)){const f=18+w*10;r+=f;g+=f+4;b+=f}
  }else if(t===MTN||t===HILL){
   const k=t===MTN?1:.55;
   if(tAt(x,y-1)!==t){r+=24*k;g+=24*k;b+=26*k}
   if(tAt(x,y+1)!==t){r-=36*k;g-=34*k;b-=30*k}
   if(t===MTN&&NZ[i]>168){r=g=b=226+VAR[i]*2}
  }else if(t===LAVA){const f=Math.sin(tm*3+x*.8+y*1.2);r+=f*18;g+=f*34;b+=f*8}
  const f=F[i];
  if(f===3){const q=Math.sin(tm*14+i)*.5+.5;r=255;g=120+q*110;b=20+q*40}
  else if(f&&low){if(f===1){r=44+v;g=108+v;b=46+v}else if(f===2){r=34+v;g=88+v;b=62+v}else{r=90;g=88;b=84}}
  const o=OWN[i];
  if(o){const c=KRGB[o];if(c){const bd=(x>0&&OWN[i-1]!==o)||(x<W-1&&OWN[i+1]!==o)||(y>0&&OWN[i-W]!==o)||(y<H-1&&OWN[i+W]!==o),k=bd?.62:.2;r+=(c[0]-r)*k;g+=(c[1]-g)*k;b+=(c[2]-b)*k}}
  const j=i<<2;D[j]=r;D[j+1]=g;D[j+2]=b;D[j+3]=255;
 }
 tcx.putImageData(img,0,0,rx0,ry0,rx1-rx0,ry1-ry0);
}

/* ---------- câmera ---------- */
function setZ(z){camz=clamp(z,.9,60);S=base*camz}
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);cw=Math.max(window.innerWidth,320);ch=Math.max(window.innerHeight,200);
 cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
 base=Math.min(cw/W,(ch-58)/H);layoutCenter();vy0=(ch-58)/2+4;setZ(camz);
}
const sx=x=>(x-camx)*S+vx0,sy=y=>(y-camy)*S+vy0,wx=px=>(px-vx0)/S+camx,wy=py=>(py-vy0)/S+camy;
function clampCam(){camx=clamp(camx,0,W);camy=clamp(camy,0,H)}
function fitCam(){camx=W/2;camy=H/2;setZ(3.5/base)}
function zoomS(v){setZ(v/base)}

/* ---------- som ---------- */
let AC=null;

function ic(n,cls){
 const d=ICON[n];if(!d)return '';
 const k=n+'|'+(cls||'');if(_icm[k])return _icm[k];
 let h='<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">';
 for(const p of d.split('|'))h+=p[0]==='!'?'<path class="f" d="'+p.slice(1)+'"/>':'<path d="'+p+'"/>';
 return _icm[k]=h+'</svg>'}
function icDraw(g,n,x,y,s,col,lw){
 const d=ICON[n];if(!d||typeof Path2D==='undefined')return;
 g.save();g.translate(x,y);g.scale(s/24,s/24);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw||1.8;g.lineCap='round';g.lineJoin='round';
 for(const p of d.split('|')){if(p[0]==='!')g.fill(new Path2D(p.slice(1)));else g.stroke(new Path2D(p))}
 g.restore()}

const hx=h=>{const n=parseInt(h.slice(1),16);return U32((n>>16)&255,(n>>8)&255,n&255)};

const shd=(c,f)=>U32(Math.min(255,(c&255)*f)|0,Math.min(255,((c>>>8)&255)*f)|0,Math.min(255,((c>>>16)&255)*f)|0);
const newSpr=(w,h)=>({w,h,d:new Uint32Array(w*h),cv:null,cf:null});
function pxl(s,x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<s.w&&y<s.h)s.d[y*s.w+x]=c}
function rct(s,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)pxl(s,x+i,y+j,c)}
function dsc(s,cx,cy,r,c){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.7)pxl(s,cx+x,cy+y,c)}
function tri(s,x0,y0,x1,y1,x2,y2,c){
 const mx=Math.floor(Math.min(x0,x1,x2)),Mx=Math.ceil(Math.max(x0,x1,x2)),my=Math.floor(Math.min(y0,y1,y2)),My=Math.ceil(Math.max(y0,y1,y2)),a=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0);if(!a)return;

 if(e.adult&&!e.sol&&q<(e.prof==='Lenhador'?0.7:0.25)){const tr=findTree(c);if(tr>=0){e.ct=tr;e.st='chop';e.to=16;return}}
 if(q<.8)wander(e,c.x,c.y,Math.min(c.R*.8,11));else e.wait=rnd(1,3)}
function join(e,c){e.city=c;e.set=null;if(e.adult)e.sol=R()<(e.p?0.1+e.p.cor/200:0.3);e.st='idle';e.wait=rnd(.2,1)}
function homeless(e){
 if(e.set){const s=e.set;s.ttl-=.6;
  if(s.ttl<0||(!s.city&&!siteOk(s.x,s.y))){e.set=null;return}
  if(Math.hypot(e.x-s.x,e.y-s.y)<3){if(!s.city||s.city.dead)s.city=found(s.x,s.y,e.k,s.k);join(e,s.city);return}
  e.tx=s.x+.5;e.ty=s.y+.5;e.st='go';e.to=30;return}
 let best=null,bd=1e9;
 for(const c of cities){if(c.k.race!==e.k||c.pop>=c.cap+1)continue;const d=Math.hypot(c.x-e.x,c.y-e.y);if(d<bd){bd=d;best=c}}
 if(best&&bd<60){if(bd<4){join(e,best);return}e.tx=best.x+.5;e.ty=best.y+.5;e.st='go';e.to=25;return}
 if(e.adult){const mates=nearAll(e.x,e.y,6,o=>o.k===e.k&&!o.city&&!o.set&&o.adult);
  if(mates.length>=2&&siteOk(e.x|0,e.y|0)){const c=found(e.x,e.y,e.k,null);for(const m of mates)join(m,c);return}}
 if(e.st==='idle'&&e.wait<=0)wander(e,e.x,e.y,9)}

function updEnt(e,dt){
 const sp=e.sp;
 e.age+=dt/YEAR;if(e.cd>0)e.cd-=dt;
 if(sp.civ&&!e.adult&&e.age>=14){e.adult=1;e.sol=R()<(e.p?0.1+e.p.cor/200:0.3)}
 if(e.age>e.life&&R()<dt*.3){hurt(e,9999,'age');return}
 hazard(e,dt);if(e.dead)return;
 if(e.ctrl)return;if(e.hold>0){e.hold-=dt;e.mv=0;return}
 if(sp.pred){e.food-=dt*.8;if(e.food<-10)hurt(e,2*dt,'hunger')}
 if((sp.herb||sp.pred)&&e.age>1.5){e.rep-=dt;if(e.rep<=0){e.rep=rnd(22,48);if((cnt[e.k]||0)<sp.cap&&(sp.herb||e.food>40)&&ents.length<MAXE){mk(e.k,e.x+rnd(-1,1),e.y+rnd(-1,1),0);if(sp.pred)e.food-=15}}}
 e.think-=dt;if(e.think<=0){e.think=rnd(.35,.8);think(e)}
 act(e,dt);
 e.x=clamp(e.x,.5,W-.5);e.y=clamp(e.y,.5,H-.5)}
function act(e,dt){
 const sp=e.sp,spd=sp.sp*(e.run||1)*(sp.civ&&!e.adult?.8:1);
 if(e.st==='idle'){e.mv=0;e.wait-=dt;if(e.wait<=0&&e.think>.05)e.think=.05;return}
 if(e.st==='hunt'){
  const t=e.tg;if(!t||t.dead){e.st='idle';e.tg=null;e.wait=.4;return}
  const d=Math.hypot(t.x-e.x,t.y-e.y);e.to-=dt;
  if(d>(sp.mon?34:20)||e.to<=0){e.st='idle';e.tg=null;e.wait=1.5;return}
  if(sp.mon){if(d<7){e.mv=0;breath(e,t.x,t.y,dt)}else{e.tx=t.x;e.ty=t.y;move(e,dt,spd)}return}
  if(d<1.15){e.mv=0;strike(e,t);e.to=Math.max(e.to,4)}else{e.tx=t.x;e.ty=t.y;move(e,dt,spd*1.2)}
  return}
 if(e.st==='raid'){
  const c=e.rc;if(!c||c.dead||!e.city||!atWar(e.city.k,c.k)){e.st='idle';e.rc=null;return}
  const d=Math.hypot(c.x-e.x,c.y-e.y);
  if(d<4){const b=nearB(e.x,e.y,3,c);if(b){e.mv=0;if(e.cd<=0){e.cd=.8;hitB(b,(sp.dmg||5)*1.3*rnd(.7,1.3),e)}return}}
  e.tx=c.x+.5;e.ty=c.y+.5;move(e,dt,spd);e.to-=dt;if(e.to<=0)e.st='idle';return}
 if(e.st==='chop'){
  const i=e.ct,x=(i%W)+.5,y=((i/W)|0)+.5;
  if(F[i]!==1&&F[i]!==2){e.st='idle';e.wait=1;return}
  if(Math.hypot(x-e.x,y-e.y)<1){e.mv=0;e.cw=(e.cw||0)+dt;if(e.cw>1.6){e.cw=0;F[i]=0;if(e.city)e.city.wood+=1.5;puff(x,y-.4,'#7a5230',4,1.5);e.st='idle';e.wait=.6}return}
  e.tx=x;e.ty=y;move(e,dt,spd);e.to-=dt;if(e.to<=0)e.st='idle';return}
 if(move(e,dt,spd)){e.st='idle';e.wait=rnd(.6,3)}
 else{e.to-=dt;if(e.to<=0||e.fail){e.fail=0;e.st='idle';e.wait=rnd(.3,1.2)}}}

/* ---------- reinos, cidades e construções ---------- */
function siteOk(x,y){
 if(x<2||y<2||x>=W-2||y>=H-2)return false;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const t=T[(y+dy)*W+x+dx];if(t<=SEA||t===MTN||t===LAVA)return false}
 const i=y*W+x;if(OWN[i]||bmap.has(i)||F[i]===3)return false;
 for(const c of cities)if(Math.hypot(c.x-x,c.y-y)<11)return false;return true}
function lineOK(x0,y0,x1,y1){for(let i=1;i<=14;i++){const x=(x0+(x1-x0)*i/14)|0,y=(y0+(y1-y0)*i/14)|0,t=T[y*W+x];if(t===DEEP||t===LAVA||t===MTN)return false}return true}
function rmB(b,rub){b.dead=true;const i=b.y*W+b.x;if(bmap.get(i)===b)bmap.delete(i);if(rub&&F[i]===0)F[i]=4}
function hitB(b,d,src){
 if(b.dead)return;b.hp-=d;if(b.hp>0)return;
 if(b.type==='center'){const c=b.c;if(src&&src.city&&src.city.k!==c.k){b.hp=b.mh*.6;capture(c,src.city.k)}else razeCity(c);return}
 rmB(b,true);puff(b.x+.5,b.y+.5,'#9a7b5a',8,2.5)}
function nearB(x,y,r,c){let b=null,bd=r*r;for(let yy=Math.max(0,(y-r)|0);yy<=Math.min(H-1,(y+r)|0);yy++)for(let xx=Math.max(0,(x-r)|0);xx<=Math.min(W-1,(x+r)|0);xx++){const o=bmap.get(yy*W+xx);if(o&&o.c===c){const d=(xx-x)**2+(yy-y)**2;if(d<bd){bd=d;b=o}}}return b}
function killK(K){kings=kings.filter(x=>x!==K);for(const o of kings){o.war.delete(K.id);o.ally.delete(K.id)}}
function razeCity(c){
 if(c.dead)return;c.dead=true;
 for(const b of blds)if(b.c===c&&!b.dead)rmB(b,true);
 cities=cities.filter(x=>x!==c);const K=c.k;K.cities=K.cities.filter(x=>x!==c);
 for(const e of ents)if(e.city===c){e.city=null;e.st='idle'}
 if(!K.cities.length)killK(K);
 puff(c.x+.5,c.y+.5,'#444',20,3);ev({k:'raze',c:c.name});toast(ic('burst')+' '+c.name+' foi destruída')}
function capture(c,K2){
 const old=c.k;old.cities=old.cities.filter(x=>x!==c);K2.cities.push(c);c.k=K2;
 for(const e of ents)if(e.city===c&&R()<.5)hurt(e,999,'war');
 if(!old.cities.length)killK(old);ev({k:'capture',c:c.name,K:K2.name});toast(ic('flag')+' '+c.name+' conquistada por '+K2.name)}
function colonize(c){
 for(let n=0;n<30;n++){const a=R()*6.283,d=rnd(14,32),x=(c.x+Math.cos(a)*d)|0,y=(c.y+Math.sin(a)*d)|0;
  if(!siteOk(x,y)||!lineOK(c.x,c.y,x,y))continue;
  const s={x,y,k:c.k,city:null,ttl:90};let m=0;
  for(const e of ents)if(e.city===c&&e.adult&&!e.sol&&!e.ruler&&!e.ctrl&&m<3){e.city=null;e.set=s;e.st='idle';m++}
  return}}
function calcOwn(){
 OWN.fill(0);OD.fill(1e9);
 for(const c of cities){const r=c.R,id=c.k.id,x0=Math.max(0,c.x-r),x1=Math.min(W-1,c.x+r),y0=Math.max(0,c.y-r),y1=Math.min(H-1,c.y+r);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const d=Math.hypot(x-c.x,y-c.y);if(d>r)continue;const i=y*W+x;if(T[i]<SAND||T[i]===LAVA)continue;if(d<OD[i]){OD[i]=d;OWN[i]=id}}}}
function touch(a,b){for(const c of a.cities)for(const d of b.cities)if(Math.hypot(c.x-d.x,c.y-d.y)<c.R+d.R+4)return true;return false}
function peace(a,b){a.war.delete(b.id);b.war.delete(a.id);ev({k:'peace',a:a.name,b:b.name});toast(ic('branch')+' Paz: '+a.name+' e '+b.name)}
function doWar(){
 const ps=[];for(let i=0;i<kings.length;i++)for(let j=i+1;j<kings.length;j++)if(!kings[i].war.has(kings[j].id))ps.push([kings[i],kings[j],touch(kings[i],kings[j])?0:1]);
 if(!ps.length){toast('Precisa de 2 reinos em paz');return}
 ps.sort((a,b)=>a[2]-b[2]+R()-.5);war(ps[0][0],ps[0][1])}
function doPeace(){let n=0;for(const K of kings){n+=K.war.size;K.war.clear()}toast(n?ic('branch')+' Todas as guerras terminaram':'Não há guerras')}

/* ---------- ambiente: terreno, fogo ---------- */
function circ(cx,cy,r,fn){const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(W-1,Math.ceil(cx+r)),y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(H-1,Math.ceil(cy+r));
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=x+.5-cx,dy=y+.5-cy,d=dx*dx+dy*dy;if(d<=r*r)fn(x,y,y*W+x,Math.sqrt(d))}}
function setT(i,t){
 if(T[i]===t)return;T[i]=t;WL[i]=0;
 if(t<=SEA||t===LAVA||t===MTN){if(F[i])F[i]=0;const b=bmap.get(i);if(b)hitB(b,99999)}
 if(t===LAVA){ignite(i-1,.5);ignite(i+1,.5);ignite(i-W,.5);ignite(i+W,.5)}}
function ignite(i,p){
 if(i<0||i>=N||T[i]<=SEA||T[i]===LAVA||F[i]===3)return;
 if(R()<p){const f=F[i];F[i]=3;FL[i]=(f===1||f===2)?ri(16,28):bmap.has(i)?ri(18,30):ri(8,14);fires.push(i)}}
function nbHas(i,t){const x=i%W,y=(i/W)|0;return(x>0&&T[i-1]===t)||(x<W-1&&T[i+1]===t)||(y>0&&T[i-W]===t)||(y<H-1&&T[i+W]===t)}
function nbTree(i){const x=i%W,y=(i/W)|0;return(x>0&&F[i-1]===1)||(x<W-1&&F[i+1]===1)||(y>0&&F[i-W]===1)||(y<H-1&&F[i+W]===1)}
function tickFire(){
 for(let n=fires.length-1;n>=0;n--){
  const i=fires[n];
  if(F[i]!==3){fires.splice(n,1);continue}
  if(--FL[i]<=0){F[i]=0;if(T[i]===GRASS&&R()<.35)T[i]=ASH;fires.splice(n,1);continue}
  const x=i%W,y=(i/W)|0,b=bmap.get(i);if(b)hitB(b,3.5);
  for(const d of D4){const nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx,f=F[j],p=(f===1||f===2)?.2:bmap.has(j)?.18:T[j]===GRASS?.05:0;if(p)ignite(j,p)}
  if(R()<.2)spark(x+.5,y+.2,rnd(-.2,.2),-rnd(.8,1.6),rnd(.6,1.1),'rgba(90,90,96,.55)',1.4,-.2)}}
function tickEnv(){
 for(let k=0;k<230;k++){
  const i=(R()*N)|0,t=T[i];
  if(t===DIRT){if(R()<.25&&nbHas(i,GRASS))T[i]=GRASS}
  else if(t===ASH){if(R()<.05)T[i]=DIRT}
  else if(t===GRASS){if(!F[i]&&!bmap.has(i)&&R()<.04&&nbTree(i))F[i]=1}
  else if(t===LAVA){if(R()<.04)T[i]=(nbHas(i,SEA)||nbHas(i,DEEP))?MTN:ASH}
  else if(t===SNOW){if(R()<.3&&nbHas(i,LAVA))T[i]=DIRT}
  if(F[i]===4&&R()<.01)F[i]=0}}

/* ---------- desastres e poderes ---------- */
function meteorHit(x,y,r){
 const water=T[(y|0)*W+(x|0)]<=SEA;
 circ(x,y,r,(a,b,i,d)=>{
  if(!water){if(d<r*.42)setT(i,LAVA);else if(d<r*.72)setT(i,ASH);else if(T[i]===GRASS)setT(i,DIRT)}
  if(F[i]&&F[i]!==3)F[i]=0;const bl=bmap.get(i);if(bl)hitB(bl,999);
  if(d>r*.7&&!water)ignite(i,.5)});
 for(const e of ents)if(!e.dead){const d=Math.hypot(e.x-x,e.y-y);if(d<r*1.6)hurt(e,260*(1-d/(r*1.7)),'boom')}
 fx.push({k:'ring',x,y,r:r*2.2,t:0,d:.7,c:'255,210,120'});
 ev({k:'meteor',x,y});shake=Math.max(shake,10+r);flash=Math.max(flash,.55);
 puff(x,y,'#ff9a2a',40,5);puff(x,y,'#ffd86a',24,3);puff(x,y,'#555',18,2.5);boom(.9,.5);vib(60)}
function nukeHit(x,y){
 const r=14;
 circ(x,y,r,(a,b,i,d)=>{
  if(F[i])F[i]=0;const bl=bmap.get(i);if(bl)hitB(bl,99999);
  if(T[i]>SEA&&T[i]!==LAVA){if(d<r*.2)setT(i,LAVA);else if(d<r*.8&&R()<.85)setT(i,ASH);else if(T[i]===GRASS&&R()<.5)setT(i,DIRT)}});
 for(const e of ents)if(!e.dead){const d=Math.hypot(e.x-x,e.y-y);if(d<r*1.5)hurt(e,9999*(1-d/(r*1.6)),'boom')}
 ev({k:'nuke',x,y});fx.push({k:'nuke',x,y,r,t:0,d:3.4});flash=1;shake=26;puff(x,y,'#ffb347',60,7);boom(1.8,.8);vib(200)}
function quake(x,y,r){
 circ(x,y,r,(a,b,i,d)=>{const f=1-d/r;
  if(R()<.1*f+.02){const t=T[i];if(t===MTN)setT(i,HILL);else if(t===HILL)setT(i,DIRT);else if(t===GRASS)setT(i,DIRT);else if(t===DIRT&&nbHas(i,SEA)&&R()<.5)setT(i,SEA)}
  const bl=bmap.get(i);if(bl&&R()<.3*f)hitB(bl,35*f+15);if(F[i]&&F[i]!==3&&R()<.04)F[i]=0});
 for(const e of ents)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r){hurt(e,8,'boom');e.x+=rnd(-1,1);e.y+=rnd(-1,1)}
 ev({k:'quake',x,y});shake=Math.max(shake,16);fx.push({k:'ring',x,y,r,t:0,d:1,c:'190,160,120'});boom(1.2,.6);vib(120)}
function bolt(x,y){
 const pts=[[x+rnd(-3,3),y-45]];for(let i=1;i<9;i++)pts.push([x+rnd(-1.2,1.2)*(9-i)/3,y-45+45*i/9]);pts.push([x,y]);
 fx.push({k:'bolt',p:pts,t:0,d:.35});flash=Math.max(flash,.35);
 const i=(y|0)*W+(x|0);ignite(i,.8);const bl=bmap.get(i);if(bl)hitB(bl,40);
 for(const e of ents)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<1.8){hurt(e,90,'bolt');e.burn=2}
 puff(x,y,'#fff6b0',10,3);tone(900,80,.25,'sawtooth',.08);boom(.35,.4)}
function launchMeteor(x,y,r){projs.push({k:'met',x,y,t:0,d:.75,r});tone(900,200,.7,'sawtooth',.04)}
function launchNuke(x,y){projs.push({k:'nuke',x,y,t:0,d:1.8});tone(300,80,1.6,'sine',.05)}
function spawnTornado(x,y){torns.push({x,y,vx:rnd(-1,1),vy:rnd(-1,1),l:16});tone(120,60,.6,'sawtooth',.04)}
function startVolcano(x,y){x=x|0;y=y|0;circ(x+.5,y+.5,5.2,(a,b,i,d)=>setT(i,d<1.7?LAVA:d<3.6?MTN:HILL));ev({k:'volcano',x,y});volcs.push({x:x+.5,y:y+.5,t:0,a:0});shake=Math.max(shake,12);boom(1,.5);vib(80)}
function updVolc(dt){
 for(const v of volcs){v.t+=dt;
  if(v.t<24){v.a-=dt;
   while(v.a<=0){v.a+=.09;const r=rnd(1,2.5+Math.min(v.t,18)*.35),an=R()*6.283,x=(v.x+Math.cos(an)*r)|0,y=(v.y+Math.sin(an)*r)|0;
    if(x>=0&&y>=0&&x<W&&y<H){const i=y*W+x;if(T[i]===MTN&&r>2.4)continue;setT(i,T[i]<=SEA?MTN:LAVA)}}
   if(R()<dt*14)spark(v.x+rnd(-1,1),v.y,rnd(-1.5,1.5),-rnd(3,6),rnd(.8,1.4),R()<.5?'#ff7a1a':'#ffd24a',1.6,5);
   if(R()<dt*5)spark(v.x,v.y-.5,rnd(-.6,.6),-rnd(1,2),rnd(1.4,2.4),'rgba(80,80,86,.6)',2.4,-.3)}
  else v.dead=true}
 volcs=volcs.filter(v=>!v.dead)}
function updTorn(dt){
 for(const t of torns){t.l-=dt;t.vx+=rnd(-1,1)*dt*4;t.vy+=rnd(-1,1)*dt*4;const m=Math.hypot(t.vx,t.vy);if(m>2.6){t.vx*=2.6/m;t.vy*=2.6/m}
  t.x=clamp(t.x+t.vx*dt,1,W-1);t.y=clamp(t.y+t.vy*dt,1,H-1);
  for(const e of ents){if(e.dead||e.sp.mon)continue;const dx=t.x-e.x,dy=t.y-e.y;if(dx*dx+dy*dy<11){e.x+=dx*dt*1.5+dy*dt*2;e.y+=dy*dt*1.5-dx*dt*2;hurt(e,14*dt,'boom');e.st='idle'}}
  circ(t.x,t.y,2.6,(a,b,i)=>{if((F[i]===1||F[i]===2)&&R()<dt*1.2)F[i]=0;const bl=bmap.get(i);if(bl)hitB(bl,26*dt)});
  if(R()<.6)spark(t.x+rnd(-2,2),t.y+rnd(-1,1),rnd(-1,1),-rnd(1,3),rnd(.5,1),pick(['#8a6a45','#4f8a3c','#b0b6bf']),1.2,1);
  if(t.l<=0)t.dead=true}
 torns=torns.filter(t=>!t.dead)}
function updProj(dt){for(const p of projs){p.t+=dt;if(p.t>=p.d){p.dead=true;if(p.k==='met')meteorHit(p.x,p.y,p.r);else nukeHit(p.x,p.y)}}projs=projs.filter(p=>!p.dead)}
function updParts(dt){for(const p of parts){p.l-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.l>0)}
function village(race,x,y){
 x=x|0;y=y|0;
 if(!siteOk(x,y)){toast(ic('x')+' Local inválido ou perto de outra cidade');return}
 const c=found(x,y,race,null);
 for(let i=0;i<5;i++){const e=mk(race,x+rnd(-2,2),y+rnd(-2,2),rnd(16,35));join(e,c)}}
function spawnAt(k,x,y){
 const sp=SP[k],n=k==='dragon'?1:NS[bi];
 for(let j=0;j<n&&ents.length<MAXE;j++){
  const a=R()*6.283,d=j?R()*BR[bi]:0,px=clamp(x+Math.cos(a)*d,.5,W-.5),py=clamp(y+Math.sin(a)*d,.5,H-.5),t=T[(py|0)*W+(px|0)];
  if(!sp.fly&&(t===DEEP||t===LAVA||(t===MTN&&!sp.hill)))continue;
  mk(k,px,py);if(k==='dragon')ev({k:'dragon',x:px,y:py});puff(px,py-.5,'#ffffff',3,1.5)}
 tone(500,800,.07,'square',.025)}

/* ---------- passo da simulação ---------- */
let tEnv=0,tCity=0,tOwn=0,tDip=0,tGrid=0,tK=0;
function step(dt){
 worldT+=dt;
 tGrid-=dt;if(tGrid<=0){tGrid=.18;rebuild()}
 for(const e of ents)if(!e.dead)updEnt(e,dt);
 tEnv-=dt;if(tEnv<=0){tEnv=.25;tickFire();tickEnv()}
 tCity-=dt;if(tCity<=0){tCity=1;tickCities()}

  else if(t===SNOW)kd=r<.5?'crystal':'ore';
